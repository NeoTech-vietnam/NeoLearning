<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title description">
  <title id="title">NeoLearning Embedded World base artwork</title>
  <desc id="description">An original text-free fantasy atlas with one continent divided into six naturally shaped countries.</desc>
  <defs>
    <filter id="paper-grain" x="-10%" y="-10%" width="120%" height="120%">
